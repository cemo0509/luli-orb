<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#eef8fb" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#dceff6" stop-opacity="0.75"/>
      <stop offset="1"    stop-color="#f7fdff" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="ar"  markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#333"/></marker>
    <marker id="ray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#12a3bd"/></marker>
  </defs>

  <rect x="0" y="0" width="980" height="640" fill="#ffffff"/>

  <text x="36" y="40" font-size="19" font-weight="bold" fill="#111">琉璃 ORB · 剖面（定稿：实心半球）</text>
  <text x="36" y="61" font-size="11.5" fill="#666">玻璃半球 Ø70 实心 + 黑遮光盖 Ø68 + 1.75" AMOLED Ø44.4　单位 mm　v2</text>

  <!-- ===== 玻璃半球（实心） ===== -->
  <path d="M 330,90 A 210,210 0 0 1 330,510 Z" fill="url(#glass)" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="330" y1="90" x2="330" y2="510" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- 光线：从球心射向表面，垂直入射不折射 -->
  <line x1="330" y1="300" x2="548" y2="183" stroke="#12a3bd" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#ray)"/>
  <line x1="330" y1="300" x2="548" y2="417" stroke="#12a3bd" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#ray)"/>
  <circle cx="330" cy="300" r="3.5" fill="#12a3bd"/>
  <text x="356" y="286" font-size="10" fill="#0b7f93">球心 → 表面垂直 → 不折射</text>

  <!-- ===== 黑遮光盖 Ø68 × 2（贴玻璃） ===== -->
  <rect x="318" y="96"  width="12" height="54" fill="#15151a"/>
  <rect x="318" y="450" width="12" height="54" fill="#15151a"/>

  <!-- 屏（板前表面，落在 Ø50 窗里） -->
  <rect x="344" y="167" width="6" height="266" fill="#12a3bd"/>

  <!-- ===== 主板 Ø51.2 × 12.1 ===== -->
  <rect x="246" y="146" width="72" height="308" rx="3" fill="#2b2b34" stroke="#9a9aa8" stroke-width="1.2"/>
  <text x="282" y="300" font-size="9.5" fill="#d8d8e2" text-anchor="middle" transform="rotate(-90 282 300)">ESP32-S3 · 1.75-B</text>

  <!-- ===== 机身 ===== -->
  <rect x="128" y="186" width="118" height="228" rx="10" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <rect x="146" y="212" width="82" height="16" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="0.8"/>
  <text x="187" y="224" font-size="8.5" fill="#555" text-anchor="middle">1000mAh</text>
  <circle cx="187" cy="300" r="20" fill="#f6f6f6" stroke="#999" stroke-width="0.8"/>
  <text x="187" y="303" font-size="8.5" fill="#555" text-anchor="middle">喇叭</text>
  <rect x="146" y="352" width="82" height="12" rx="2" fill="#f2f2f2" stroke="#999" stroke-width="0.8"/>
  <text x="187" y="362" font-size="8" fill="#555" text-anchor="middle">灯环 / 接口</text>

  <!-- ===== 标注 ===== -->
  <line x1="72" y1="90" x2="72" y2="510" stroke="#333" stroke-width="0.9" marker-start="url(#ar2)" marker-end="url(#ar)"/>
  <text x="56" y="308" font-size="11.5" fill="#333" transform="rotate(-90 56 308)">Ø70</text>

  <line x1="330" y1="556" x2="540" y2="556" stroke="#333" stroke-width="0.9" marker-start="url(#ar2)" marker-end="url(#ar)"/>
  <line x1="540" y1="510" x2="540" y2="562" stroke="#666" stroke-width="0.6" stroke-dasharray="3 3"/>
  <text x="430" y="572" font-size="10.5" fill="#333" text-anchor="middle">35 = 半径（平面过球心）</text>

  <line x1="470" y1="352" x2="430" y2="392" stroke="#555" stroke-width="0.7"/>
  <text x="432" y="406" font-size="10" fill="#333">玻璃半球（实心，凸面朝前）</text>

  <line x1="324" y1="128" x2="290" y2="106" stroke="#555" stroke-width="0.7"/>
  <text x="196" y="102" font-size="10" fill="#333">黑遮光盖 Ø68×2（贴玻璃）</text>

  <line x1="326" y1="440" x2="300" y2="466" stroke="#555" stroke-width="0.7"/>
  <text x="200" y="480" font-size="10" fill="#333">中心 Ø50 窗</text>

  <line x1="350" y1="420" x2="372" y2="446" stroke="#12a3bd" stroke-width="0.8"/>
  <text x="376" y="460" font-size="10" fill="#0b7f93">屏 Ø44.4（板前表面）</text>

  <line x1="250" y1="470" x2="232" y2="494" stroke="#555" stroke-width="0.7"/>
  <text x="118" y="508" font-size="10" fill="#333">主板 Ø51.2×12.1（屏板一体）</text>

  <!-- ===== 右侧 ===== -->
  <line x1="596" y1="86" x2="596" y2="600" stroke="#e4e4e4" stroke-width="1"/>

  <text x="618" y="106" font-size="13" font-weight="bold" fill="#111">正视效果（1:4）</text>
  <circle cx="764" cy="232" r="140" fill="#ffffff" stroke="#111" stroke-width="1.8"/>
  <circle cx="764" cy="232" r="132" fill="#0c0c0f"/>
  <rect x="706" y="204" width="23" height="56" rx="11.5" fill="#8af0fa"/>
  <rect x="800" y="204" width="23" height="56" rx="11.5" fill="#8af0fa"/>
  <text x="618" y="404" font-size="10.5" fill="#666">眼 5.6×14.0mm（20% 球径）· 中心距 18.1mm（25.9%）</text>

  <text x="618" y="444" font-size="13" font-weight="bold" fill="#111">图层</text>
  <rect x="618" y="456" width="20" height="13" fill="url(#glass)" stroke="#1a1a1a" stroke-width="1"/>
  <text x="646" y="466" font-size="11" fill="#333">实心玻璃半球 Ø70</text>
  <rect x="618" y="478" width="20" height="13" fill="#15151a"/>
  <text x="646" y="488" font-size="11" fill="#333">黑遮光盖 Ø68（哑光，中间开窗）</text>
  <rect x="618" y="500" width="20" height="13" fill="#12a3bd"/>
  <text x="646" y="510" font-size="11" fill="#333">AMOLED 显示面 Ø44.4</text>
  <rect x="618" y="522" width="20" height="13" fill="#2b2b34" stroke="#9a9aa8" stroke-width="1"/>
  <text x="646" y="532" font-size="11" fill="#333">主板 Ø51.2（屏板一体）</text>

  <text x="618" y="566" font-size="13" font-weight="bold" fill="#111">三个关键数字</text>
  <text x="618" y="586" font-size="10.5" fill="#333">① 屏在球心平面上 → 中心入射角 0° → 1:1 无畸变</text>
  <text x="618" y="604" font-size="10.5" fill="#333">② 屏 Ø44.4 占球径 63.5%，黑边 12.8mm</text>
  <text x="618" y="622" font-size="10.5" fill="#333">③ 屏黑 #000000 + 哑光遮光盖 → 屏边物理消失</text>
</svg>
