<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#111">琉璃 ORB · 剖面示意图</text>
  <text x="40" y="63" font-size="11.5" fill="#666">Ø110 透明球 + Ø99 黑内胆 + 1.75" AMOLED 贴窗　单位 mm　v0.1</text>

  <!-- ===== 黑内胆（实心填充表示"整块黑"） ===== -->
  <circle cx="320" cy="300" r="193" fill="#15151a"/>
  <circle cx="320" cy="300" r="193" fill="none" stroke="#3c3c48" stroke-width="3"/>
  <circle cx="320" cy="300" r="188" fill="none" stroke="#4c4c5a" stroke-width="0.8" stroke-dasharray="3 4"/>

  <!-- 前切平面 + 窗口 + 屏 -->
  <line x1="488" y1="195.2" x2="488" y2="404.8" stroke="#3c3c48" stroke-width="9"/>
  <rect x="482" y="206" width="12" height="188" fill="#08080b"/>
  <rect x="483.5" y="211.2" width="9" height="177.6" rx="4" fill="#12a3bd"/>

  <!-- 主板 -->
  <rect x="440" y="198" width="42" height="204" rx="3" fill="#2b2b34" stroke="#9a9aa8" stroke-width="1.1"/>
  <text x="464" y="300" font-size="9.5" fill="#d8d8e2" text-anchor="middle" transform="rotate(-90 464 300)">ESP32-S3 · 1.75-B</text>

  <!-- ===== 球壳（透明，只画轮廓） ===== -->
  <circle cx="320" cy="300" r="220" fill="none" stroke="#111111" stroke-width="2"/>
  <circle cx="320" cy="300" r="208" fill="none" stroke="#6b6b78" stroke-width="0.9" stroke-dasharray="5 4"/>

  <!-- ===== 底座 ===== -->
  <rect x="100" y="489" width="440" height="57" rx="7" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <rect x="112" y="492" width="416" height="5" rx="2.5" fill="#e6f7fa" stroke="#12a3bd" stroke-width="0.8"/>
  <line x1="106" y1="524" x2="534" y2="524" stroke="#9a9a9a" stroke-width="0.9" stroke-dasharray="6 4"/>
  <rect x="152" y="529" width="150" height="12" rx="2" fill="#f4f4f4" stroke="#888" stroke-width="0.9"/>
  <text x="160" y="538" font-size="9" fill="#555">2000mAh · 3.7V</text>
  <rect x="330" y="529" width="62" height="12" rx="2" fill="#f4f4f4" stroke="#888" stroke-width="0.9"/>
  <text x="335" y="538" font-size="9" fill="#555">MAX98357A</text>
  <circle cx="442" cy="520" r="13" fill="#f4f4f4" stroke="#888" stroke-width="0.9"/>
  <text x="432" y="523" font-size="8.5" fill="#555">喇叭</text>
  <rect x="294" y="483" width="52" height="8" rx="2" fill="#fff" stroke="#c0392b" stroke-width="1.2"/>

  <!-- ===== 标注 ===== -->
  <!-- Ø110 -->
  <line x1="74" y1="80" x2="74" y2="520" stroke="#333" stroke-width="0.9" marker-start="url(#ar2)" marker-end="url(#ar)"/>
  <text x="58" y="304" font-size="11" fill="#333" transform="rotate(-90 58 304)">Ø110</text>

  <!-- 壁厚 3.0 -->
  <line x1="348" y1="98" x2="330" y2="84" stroke="#333" stroke-width="0.8"/>
  <text x="352" y="102" font-size="10" fill="#333">壁厚 3.0</text>

  <!-- 屏距 10 -->
  <line x1="492" y1="166" x2="526" y2="166" stroke="#333" stroke-width="0.9" marker-start="url(#ar2)" marker-end="url(#ar)"/>
  <text x="500" y="158" font-size="10" fill="#333">10</text>

  <!-- 窗口/屏 -->
  <text x="300" y="436" font-size="10" fill="#c9c9d4">Ø47 窗 · Ø44.4 屏</text>
  <line x1="420" y1="432" x2="482" y2="400" stroke="#c9c9d4" stroke-width="0.7"/>

  <!-- pogo -->
  <text x="296" y="474" font-size="9.5" fill="#ff8b7a">8pin pogo</text>

  <!-- 视差 -->
  <line x1="488" y1="300" x2="690" y2="300" stroke="#12a3bd" stroke-width="0.9" stroke-dasharray="5 3"/>
  <line x1="488" y1="300" x2="610" y2="232" stroke="#c0392b" stroke-width="0.9" stroke-dasharray="5 3"/>
  <path d="M 556,300 A 68,68 0 0 0 542,264" fill="none" stroke="#c0392b" stroke-width="0.9" marker-end="url(#ar)"/>
  <text x="560" y="286" font-size="10" fill="#c0392b">30°</text>

  <!-- ===== 右侧 ===== -->
  <line x1="586" y1="86" x2="586" y2="566" stroke="#e4e4e4" stroke-width="1"/>

  <text x="612" y="106" font-size="13" font-weight="bold" fill="#111">正视效果</text>
  <circle cx="756" cy="216" r="78" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <circle cx="756" cy="216" r="72" fill="#0c0c0f"/>
  <rect x="716" y="164" width="9" height="6" fill="none" stroke="#8fd8e4" stroke-width="0.9"/>
  <text x="741" y="171" font-size="9" fill="#8fd8e4">16:19</text>
  <rect x="778" y="165" width="14" height="7" rx="1.5" fill="none" stroke="#8fd8e4" stroke-width="0.9"/>
  <rect x="731" y="206" width="10" height="26" rx="5" fill="#7fe3f0"/>
  <rect x="771" y="206" width="10" height="26" rx="5" fill="#7fe3f0"/>
  <text x="612" y="314" font-size="10" fill="#666">眼 7.0×17.6mm，中心距 23.6（=球径 16%）</text>

  <text x="612" y="352" font-size="13" font-weight="bold" fill="#111">图层</text>
  <line x1="612" y1="366" x2="632" y2="366" stroke="#111" stroke-width="2"/>
  <text x="640" y="370" font-size="11" fill="#333">球壳（亚克力 3mm，内外抛光）</text>
  <line x1="612" y1="388" x2="632" y2="388" stroke="#15151a" stroke-width="9"/>
  <text x="640" y="392" font-size="11" fill="#333">黑内胆（PETG 2.5mm + 哑光黑）</text>
  <line x1="612" y1="410" x2="632" y2="410" stroke="#12a3bd" stroke-width="6"/>
  <text x="640" y="414" font-size="11" fill="#333">AMOLED 显示面（466×466）</text>
  <rect x="612" y="426" width="20" height="12" fill="#2b2b34" stroke="#9a9aa8" stroke-width="1"/>
  <text x="640" y="436" font-size="11" fill="#333">主控板 Ø51×12.1（屏板一体）</text>
  <rect x="612" y="450" width="20" height="8" fill="#fff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="640" y="458" font-size="11" fill="#333">磁吸 + 8pin pogo（可断开）</text>

  <text x="612" y="494" font-size="13" font-weight="bold" fill="#111">三个关键数字</text>
  <text x="612" y="516" font-size="11" fill="#333">① 屏退到球壳内表面后 10mm → 侧 30° 视差 5.8mm</text>
  <text x="612" y="536" font-size="11" fill="#333">② 窗 Ø47 &lt; 板 Ø51 → 板边被内胆压住，看不见</text>
  <text x="612" y="556" font-size="11" fill="#333">③ 屏黑 #000000 + 内胆哑光 → 屏边物理消失</text>
</svg>
